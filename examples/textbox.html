<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Text Box Example</title>
  <style>
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    .textbox {
      border: 2px solid #333;
      border-radius: 8px;
      padding: 24px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .textbox h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }
    .textbox h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
      color: #555;
      font-weight: 600;
    }
    .textbox p {
      margin: 0;
      color: #333;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="textbox">
      <h1>About Me</h1>
      <h2>Zuzanna Koziatek</h2>
      <p>I teach this class.</p>
    </div>
  </div>
</body>
</html>
