<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Reading, Writing and Inquiry Resources Manual</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary-dark: #1b4332;
      --primary-medium: #2d6a4f;
      --primary-light: #40916c;
      --accent-blue: #1e3a8a;
      --accent-light: #e8f5e9;
      --accent-lighter: #f1f5fe;
      --text-dark: #1a1a1a;
      --text-light: #555555;
      --border-color: #e0e0e0;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      line-height: 1.6;
      color: var(--text-dark);
      background-color: #fafafa;
    }
    
    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-medium) 100%);
      padding: 4rem 0 3rem 0;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05) 0%, transparent 50%);
      pointer-events: none;
    }
    
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      z-index: 1;
    }
    
    h1 {
      font-size: 3rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
      font-weight: 700;
      letter-spacing: -1px;
    }
    
    .subtitle {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 2.5rem;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    
    nav {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding: 0 1rem;
    }
    
    nav a {
      color: rgba(255, 255, 255, 0.95);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.6rem 1.2rem;
      transition: all 0.3s ease;
      border-radius: 4px;
      position: relative;
    }
    
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    
    nav a:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    nav a:hover::after {
      width: calc(100% - 2.4rem);
    }

    .separator {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border-color), transparent);
      margin: 0;
    }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      nav {
        gap: 1rem;
        margin-bottom: 1rem;
      }

      nav a {
        padding: 0.5rem 0.9rem;
        font-size: 0.85rem;
      }

      .main-content {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Reading, Writing, and Inquiry Resources</h1>
      <p class="subtitle">Zuzanna Koziatek</p>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Your Instructor</a>
        <a href="reading-resources.html">Reading Resources</a>
        <a href="writing-resources.html">Writing Resources</a>
        <a href="inquiry-resources.html">Inquiry Resources</a>
      </nav>
    </div>
  </header>

  <div class="separator"></div>

  <div class="main-content">
    <div style="text-align: center; padding: 3rem 2rem;">
      <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Welcome</h2>
      <p style="font-size: 1.1rem; color: var(--text-light); max-width: 600px; margin: 0 auto;">
        Select a section from the navigation above to explore the course resources.
      </p>
    </div>
  </div>
</body>
</html>
