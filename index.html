<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Reading, Writing and Inquiry Resources Manual</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary-dark: #1b4332;
      --primary-medium: #2d6a4f;
      --primary-light: #40916c;
      --accent-blue: #1e3a8a;
      --accent-light: #e8f5e9;
      --accent-lighter: #f1f5fe;
      --text-dark: #1a1a1a;
      --text-light: #555555;
      --border-color: #e0e0e0;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      line-height: 1.6;
      color: var(--text-dark);
      background-color: #fafafa;
    }
    
    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-medium) 100%);
      padding: 4rem 0 3rem 0;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05) 0%, transparent 50%);
      pointer-events: none;
    }
    
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      z-index: 1;
    }
    
    h1 {
      font-size: 3rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
      font-weight: 700;
      letter-spacing: -1px;
    }
    
    .subtitle {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 2.5rem;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    
    nav {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding: 0 1rem;
    }
    
    nav a {
      color: rgba(255, 255, 255, 0.95);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.6rem 1.2rem;
      transition: all 0.3s ease;
      border-radius: 4px;
      position: relative;
    }
    
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    
    nav a:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    nav a:hover::after {
      width: calc(100% - 2.4rem);
    }

    .separator {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border-color), transparent);
      margin: 0;
    }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .main-content img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 3rem;
    }

    .about-instructor {
      background: linear-gradient(135deg, var(--accent-light) 0%, rgba(64, 145, 108, 0.05) 100%);
      border: 1px solid rgba(64, 145, 108, 0.2);
      padding: 2.5rem;
      border-radius: 12px;
      margin-top: 2rem;
      margin-bottom: 3rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .about-instructor:hover {
      box-shadow: var(--shadow-md);
    }

    .about-instructor h2 {
      font-size: 1.75rem;
      color: var(--primary-dark);
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .about-instructor p {
      margin-bottom: 1.2rem;
      line-height: 1.8;
      color: var(--text-light);
    }

    .about-instructor ul {
      list-style-position: inside;
      padding-left: 2rem;
      margin-top: 1.5rem;
    }

    .about-instructor li {
      margin-bottom: 0.8rem;
      line-height: 1.7;
      color: var(--text-light);
    }

    .reading-resources {
      padding: 0;
    }

    .reading-resources h2 {
      font-size: 2.2rem;
      color: var(--text-dark);
      background: linear-gradient(135deg, var(--accent-lighter) 0%, rgba(30, 58, 138, 0.05) 100%);
      padding: 1.5rem 2rem;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 2.5rem;
      font-weight: 600;
      border: 1px solid rgba(30, 58, 138, 0.1);
    }

    .reading-resources h3 {
      font-size: 1.4rem;
      color: var(--primary-dark);
      background: linear-gradient(135deg, var(--accent-lighter) 0%, rgba(30, 58, 138, 0.05) 100%);
      padding: 1rem 1.5rem;
      margin-top: 2.5rem;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      border-left: 4px solid var(--primary-light);
      font-weight: 600;
    }

    .reading-resources h4 {
      font-size: 1.15rem;
      color: var(--text-dark);
      margin-top: 1.8rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .reading-resources p {
      margin-bottom: 1.2rem;
      line-height: 1.8;
      color: var(--text-light);
    }

    .reading-resources ul {
      list-style-position: inside;
      padding-left: 2rem;
      margin-bottom: 1.5rem;
    }

    .reading-resources li {
      margin-bottom: 0.9rem;
      line-height: 1.7;
      color: var(--text-light);
    }

    .reading-resources a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
      border-bottom: 1px solid transparent;
    }

    .reading-resources a:hover {
      color: var(--primary-light);
      border-bottom: 1px solid var(--primary-light);
    }

    .blockquote {
      border-left: 4px solid var(--primary-light);
      padding: 1.5rem 2rem;
      margin: 2rem 0;
      font-style: italic;
      color: var(--text-light);
      background-color: rgba(64, 145, 108, 0.04);
      border-radius: 4px;
    }

    .blockquote p {
      margin-bottom: 0.8rem;
    }

    .blockquote strong {
      font-style: normal;
      color: var(--text-dark);
    }

    .highlight-blue {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .highlight-red {
      color: #d32f2f;
      font-weight: 600;
    }

    .mla-note {
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.05) 0%, rgba(30, 58, 138, 0.02) 100%);
      padding: 1.5rem 2rem;
      border-left: 4px solid var(--accent-blue);
      margin: 1.5rem 0;
      border-radius: 8px;
      border: 1px solid rgba(30, 58, 138, 0.1);
    }

    .mla-note strong {
      color: var(--accent-blue);
      text-decoration: underline;
    }

    .course-section {
      background: linear-gradient(135deg, var(--accent-lighter) 0%, rgba(30, 58, 138, 0.05) 100%);
      padding: 2.5rem;
      border-radius: 12px;
      margin-top: 2rem;
      border: 1px solid rgba(30, 58, 138, 0.1);
      box-shadow: var(--shadow-sm);
    }

    .course-section h2 {
      font-size: 1.6rem;
      color: var(--primary-dark);
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 600;
    }

    .course-section h3 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      color: var(--primary-medium);
    }

    .course-section ul {
      list-style-position: inside;
      padding-left: 2rem;
    }

    .course-section li {
      margin-bottom: 0.9rem;
      line-height: 1.7;
      color: var(--text-light);
    }

    .highlight {
      color: var(--accent-blue);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      nav {
        gap: 1rem;
        margin-bottom: 1rem;
      }

      nav a {
        padding: 0.5rem 0.9rem;
        font-size: 0.85rem;
      }

      .main-content {
        padding: 2rem 1rem;
      }

      .about-instructor,
      .course-section {
        padding: 1.5rem;
      }

      .reading-resources h2 {
        font-size: 1.6rem;
        padding: 1rem 1.5rem;
      }

      .reading-resources h3 {
        font-size: 1.1rem;
        padding: 0.75rem 1rem;
        margin-top: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Reading, Writing, and Inquiry Resources</h1>
      <p class="subtitle">Zuzanna Koziatek</p>
      <nav>
        <a href="about.html">About Your Instructor</a>
        <a href="reading-resources.html">Reading Resources</a>
        <a href="writing-resources.html">Writing Resources</a>
        <a href="inquiry-resources.html">Inquiry Resources</a>
      </nav>
    </div>
  </header>

  <div class="separator"></div>

  <div class="main-content">
    <div style="text-align: center; padding: 3rem 2rem;">
      <h2 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 1rem;">Welcome</h2>
      <p style="font-size: 1.1rem; color: var(--text-light); max-width: 600px; margin: 0 auto;">
        Select a section from the navigation above to explore the course resources.
      </p>
    </div>
  </div>
</body>
</html>
