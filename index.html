<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Reading, Writing and Inquiry Resources Manual</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    
    header {
      background-color: #C8E6C9;
      padding: 3rem 0 2rem 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    
    h1 {
      font-size: 2.5rem;
      color: #2d5016;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    
    .subtitle {
      font-size: 1.3rem;
      color: #558b2f;
      margin-bottom: 2rem;
      font-weight: 400;
    }
    
    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    
    nav a {
      color: #2d5016;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
    }
    
    nav a:hover {
      color: #558b2f;
      border-bottom: 2px solid #558b2f;
    }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .main-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>The Reading, Writing, and Inquiry Resources Manual</h1>
      <p class="subtitle">Zuzanna Koziatek</p>
      <nav>
        <a href="#home">Home</a>
        <a href="#resources">Resources</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <img 
      src="Untitled%20-%20August%2028%2C%202026%20at%2021.33.11%20(1).png" 
      alt="Diagram showing the recursive nature of the writing process from the first step with pre-writing through drafting, peer review and revision, to editing and final draft"
    >
  </main>
</body>
</html>
