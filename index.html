<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Reading, Writing and Inquiry Resources Manual</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    
    header {
      background-color: #C8E6C9;
      padding: 3rem 0 2rem 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    
    h1 {
      font-size: 2.5rem;
      color: #2d5016;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    
    .subtitle {
      font-size: 1.3rem;
      color: #558b2f;
      margin-bottom: 2rem;
      font-weight: 400;
    }
    
    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    
    nav a {
      color: #2d5016;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
    }
    
    nav a:hover {
      color: #558b2f;
      border-bottom: 2px solid #558b2f;
    }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .main-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 3rem;
    }

    .course-section {
      background-color: #d1d9ff;
      padding: 2rem;
      border-radius: 8px;
      margin-top: 2rem;
    }

    .course-section h2 {
      font-size: 1.5rem;
      color: #000000;
      margin-bottom: 1rem;
      text-align: center;
    }

    .course-section h3 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .course-section ul {
      list-style-position: inside;
      padding-left: 2rem;
    }

    .course-section li {
      margin-bottom: 0.8rem;
      line-height: 1.6;
    }

    .highlight {
      color: #0e68b3;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Reading, Writing, and Inquiry Resources</h1>
      <p class="subtitle">Zuzanna Koziatek</p>
      <nav>
        <a href="#aboutyourinstructor">About Your Instructor</a>
        <a href="#readingresources">Reading Resources</a>
        <a href="#writingresources">Writing Resources</a>
        <a href="#inquiryresources">Inquiry Resources</a>
      </nav>
    </div>
  </header>
</body>
</html>
